<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #020617;
      padding: 50px;
      border-radius: 10px;
      width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #38bdf8;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #020617;
      color: #fff;
    }

    .input-group input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 5px #38bdf8;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0ea5e9;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .forgot:hover {
      color: #38bdf8;
    }

    .error {
      color: #ef4444;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Login</h2>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="input-group">
      <input type="text" name="username" placeholder="Username" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit">Login</button>
    <!-- {# <a href="{% url 'forgot_password' %}" class="forgot">Forgot Password?</a> #} -->
    <a href="#" class="forgot">
       Forgot Password?
     </a>

  </form>
</div>

</body>
</html>
