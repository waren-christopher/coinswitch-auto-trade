<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial;
    }

    .box {
      background: #020617;
      padding: 40px;
      width: 400px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      background: #020617;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: red;
      margin-bottom: 10px;
      text-align: center;
    }

    h2 {
      color: white;
      text-align: center;
    }

    .confirm-box {
      text-align: center;
      color: white;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="box">

  <h2>Forgot Password</h2>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <!-- STEP 1 -->
    {% if not show_confirm and not show_otp and not show_password %}
      <input type="text" name="username" placeholder="Enter Username" required>
      <button name="action" value="check_user">Continue</button>
    {% endif %}

    <!-- STEP 2 CONFIRM -->
    {% if show_confirm %}
      <input type="hidden" name="username" value="{{ username }}">
      <div class="confirm-box">
        Send OTP to your registered email?
      </div>
      <button name="action" value="send_otp">Yes, Send OTP</button>
    {% endif %}

    <!-- STEP 3 OTP -->
    {% if show_otp %}
      <input type="hidden" name="username" value="{{ username }}">
      <input type="text" name="otp" placeholder="Enter OTP" required>
      <button name="action" value="verify_otp">Verify OTP</button>
    {% endif %}

    <!-- STEP 4 PASSWORD -->
    {% if show_password %}
      <input type="password" name="password" placeholder="New Password" required>
      <button name="action" value="reset_password">Reset Password</button>
    {% endif %}

  </form>

</div>

</body>
</html>
